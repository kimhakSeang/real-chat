<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#d2be94">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Join · Event Board</title>
    <link rel="icon" type="image/png" href="component/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="component/vintage-login.css">
</head>
<body>
<div class="wrap">
    <img class="brand-logo" src="component/img/logo-vintage.png" alt="Vintage" width="168" height="90">

    <div class="welcome">
        <span class="post l" aria-hidden="true"></span><span class="post r" aria-hidden="true"></span>
        <span class="flo t" aria-hidden="true"></span><span class="flo b" aria-hidden="true"></span>
        <h1>Welcome</h1>
    </div>
    <p class="lead">Enter your name to see announcements and chat with others.</p>

    <form class="login" id="login-form" novalidate>
        <label for="name">Your name</label>
        <input id="name" maxlength="40" autocomplete="nickname" autofocus placeholder="e.g. alice">
        <div class="error" id="error" role="alert"></div>
        <button class="primary" type="submit">Continue</button>

        <div class="or">or</div>
        <button class="secondary" type="button" id="guest">Join as guest</button>
    </form>
</div>

<script>
    const VALID = /^[A-Za-z0-9_-]{1,20}$/;          // same rule as the server (NameHandshakeHandler)
    const input = document.getElementById('name'), error = document.getElementById('error');

    try {                                            // pre-fill with the name used last time in this tab
      const prev = sessionStorage.getItem('chatName');
      if (prev && VALID.test(prev)) input.value = prev;
    } catch (e) {}

    function enter(name) {
      try { sessionStorage.setItem('chatName', name); }
      catch (e) { location.href = 'user.html?name=' + encodeURIComponent(name); return; }   // storage blocked
      location.href = 'user.html';
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = input.value.trim().replace(/\s+/g, '_');      // "John Smith" → "John_Smith"
      if (!VALID.test(name)) {
        error.textContent = 'Use letters, numbers, "_" or "-" (1 to 20 characters).';
        input.focus();
        return;
      }
      enter(name);
    });
    input.addEventListener('input', () => { error.textContent = ''; });

    document.getElementById('guest').addEventListener('click', () => {
      enter('guest-' + (1000 + Math.floor(Math.random() * 9000)));
    });
</script>
</body>
</html>
